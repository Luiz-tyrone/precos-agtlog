<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#352344">
<title>AGT-LOG · Informar preços</title>
<style>
:root{--purple:#352344;--purple-2:#452d57;--purple-soft:#f2edf5;--yellow:#ffcd50;--bg:#f5f5f7;--surface:#fff;--surface-2:#faf9fb;--text:#211b25;--muted:#746d79;--border:#e8e4eb;--border-strong:#d9d2de;--green:#19734a;--green-bg:#eaf7f0;--red:#b33b32;--shadow:0 12px 34px rgba(39,27,45,.07);--radius:20px;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,205,80,.7);outline-offset:2px}
.site-head{background:var(--surface);border-bottom:1px solid var(--border);padding:12px max(18px,env(safe-area-inset-left));position:sticky;top:0;z-index:20}.site-head-inner{max-width:850px;margin:0 auto;display:flex;align-items:center;gap:13px}.site-head img{width:106px;height:44px;object-fit:contain}.site-head-copy{border-left:1px solid var(--border);padding-left:13px}.site-head-copy strong{display:block;color:var(--purple);font-size:14px}.site-head-copy span{font-size:11px;color:var(--muted)}
main{max-width:850px;margin:0 auto;padding:24px 16px 110px}.card{background:transparent}.welcome{background:linear-gradient(135deg,var(--purple),#49345a);border-radius:22px;padding:23px;color:#fff;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,205,80,.1);right:-55px;top:-75px}.welcome .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--yellow);font-weight:800}.welcome h2{font-size:25px;line-height:1.12;margin:5px 0 8px}.welcome p{margin:0;color:rgba(255,255,255,.77);max-width:630px;font-size:13px}
.info-note{display:flex;gap:10px;align-items:flex-start;background:#fff9e9;border:1px solid #f7e6ad;border-radius:14px;padding:11px 13px;color:#6f5c22;font-size:12px;margin-bottom:14px}.info-note b{color:#5e4a11}.info-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:var(--yellow);color:var(--purple);font-weight:900;flex:0 0 auto}
.units{display:grid;gap:12px}.station-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 5px 18px rgba(39,27,45,.045)}.station-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #f0edf2;padding-bottom:13px;margin-bottom:14px}.station-name{font-size:17px;font-weight:800;color:var(--purple);line-height:1.25}.station-place{font-size:12px;color:var(--muted);margin-top:3px}.station-chip{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:5px 8px;white-space:nowrap}
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.price-field{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px}.price-field label{display:block;font-size:11px;color:#5e5662;font-weight:800;margin-bottom:5px}.price-input{display:flex;align-items:center;gap:6px}.price-input span{font-weight:800;color:var(--purple);font-size:13px}.price-field input{width:100%;min-width:0;border:1px solid var(--border-strong);background:#fff;color:var(--text);border-radius:10px;padding:11px 10px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.price-field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(53,35,68,.08);outline:none}.last-price{font-size:10px;color:var(--muted);margin-top:6px}.last-price b{color:#554b5b}
.extra-fields{display:grid;gap:9px;margin-top:13px;padding-top:13px;border-top:1px solid #f0edf2}.fl{display:block;font-size:11px;font-weight:800;color:#5c5461;margin:0 0 4px}.extra-fields input,.extra-fields textarea{width:100%;border:1px solid var(--border-strong);background:#fff;color:var(--text);border-radius:10px;padding:10px 11px}.extra-fields textarea{resize:vertical;min-height:72px}
.action-zone{position:sticky;bottom:10px;z-index:15;margin-top:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:17px;padding:10px;box-shadow:0 14px 40px rgba(39,27,45,.13);display:flex;gap:8px;align-items:center}.btn{border:0;background:var(--purple);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:var(--purple-2)}.btn:disabled{opacity:.6;cursor:wait}.btn.primary{flex:1;font-size:15px}.btn.secondary{background:var(--surface);color:var(--purple);border:1px solid var(--border);font-size:12px}.btn.secondary:hover{background:var(--purple-soft)}
.erro{color:var(--red);font-size:12px;font-weight:650;min-height:1.2em;margin:9px 3px}.loading{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}.loading-dot{width:36px;height:36px;border:3px solid var(--purple-soft);border-top-color:var(--purple);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.invalid{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.invalid-icon{width:52px;height:52px;margin:0 auto 12px;display:grid;place-items:center;border-radius:50%;background:#fff0ee;color:var(--red);font-size:22px;font-weight:900}.invalid h2{margin:0 0 6px;color:var(--purple)}.invalid p{margin:0;color:var(--muted)}
.sucesso{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:34px 22px;box-shadow:var(--shadow)}.sucesso .v{width:66px;height:66px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:28px;font-weight:900;display:grid;place-items:center;margin:0 auto 13px}.sucesso h2{color:var(--purple)}.sucesso p{color:var(--muted)}
.footer{text-align:center;color:#a099a3;font-size:10px;padding:12px 0 0}
@media(max-width:650px){.site-head{padding:9px 13px}.site-head img{width:92px;height:39px}.site-head-copy span{display:none}main{padding:15px 11px 104px}.welcome{padding:18px;border-radius:18px}.welcome h2{font-size:22px}.station-card{padding:14px;border-radius:17px}.price-grid{grid-template-columns:1fr}.price-field{display:grid;grid-template-columns:1fr minmax(130px,170px);column-gap:10px;align-items:center}.price-field label{margin:0}.price-input{grid-column:2;grid-row:1 / span 2}.last-price{grid-column:1;grid-row:2;margin:2px 0 0}.action-zone{bottom:max(8px,env(safe-area-inset-bottom));flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<header class="site-head"><div class="site-head-inner"><img src="logo.png" alt="AGT-LOG Logística e Cargas"><div class="site-head-copy"><strong>Atualização de preços</strong><span>Canal exclusivo para responsáveis de postos</span></div></div></header>
<main>
 <div class="card" id="box"><div class="loading"><div class="loading-dot"></div><p>Carregando suas unidades…</p></div></div>
 <div class="footer">AGT-LOG · Controle de preços de combustível</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),f=v=>v==null?"":Number(v).toFixed(2).replace(".",",");
const sb=supabase.createClient(CFG.url,CFG.key),NM={s10:"Diesel S-10",s500:"Diesel S-500",arla:"Arla"},tk=new URLSearchParams(location.search).get("t");
let T=null;
const num=s=>{const n=parseFloat(String(s).replace(",","."));return isNaN(n)?null:n};
async function iniciar(){
 if(!tk)return invalido();
 const {data,error}=await sb.rpc("carregar_tela",{p_token:tk});
 if(error||!data)return invalido();
 T=data;desenhar()}
function invalido(){$("box").innerHTML=`<div class="invalid"><div class="invalid-icon">!</div><h2>Link inválido</h2><p>Este link não está ativo. Peça um novo link à equipe da AGT-LOG.</p></div>`}
function desenhar(){
 $("box").innerHTML=`<section class="welcome"><div class="eyebrow">Atualização diária</div><h2>Olá, ${esc(T.responsavel)}</h2><p>Informe os preços praticados hoje nas unidades abaixo. O envio leva poucos segundos.</p></section><div class="info-note"><span class="info-icon">i</span><div><b>Como preencher:</b> digite apenas os preços dos combustíveis vendidos pela unidade. O último valor informado aparece abaixo de cada campo para conferência.</div></div><div class="units" id="us"></div><p class="erro" id="er" role="alert"></p><div class="action-zone"><button class="btn primary" id="env">Enviar preços de hoje</button>${T.postos.length>1?`<button class="btn secondary" id="igual">Copiar valores da 1ª unidade</button>`:""}</div>`;
 $("us").innerHTML=T.postos.map((p,j)=>{const c=p.config||{};return `<article class="station-card"><div class="station-top"><div><div class="station-name">${esc(p.nome)}</div><div class="station-place">${esc(p.cidade)}${p.uf?" · "+p.uf:""}</div></div><span class="station-chip">Unidade ${j+1}</span></div><div class="price-grid">${(p.produtos||[]).map(k=>`<div class="price-field"><label for="u${j}${k}">${NM[k]}</label><div class="price-input"><span>R$</span><input id="u${j}${k}" inputmode="decimal" placeholder="0,00" autocomplete="off"></div><div class="last-price">Último informado: <b>${p.ultimos?.[k]!=null?"R$ "+f(p.ultimos[k]):"sem valor anterior"}</b></div></div>`).join("")}</div>${c.observacao||(c.extras||[]).length?`<div class="extra-fields">${c.observacao?`<div><label class="fl" for="o${j}">Observação (opcional)</label><textarea id="o${j}" rows="2" placeholder="Digite uma observação, se necessário"></textarea></div>`:""}${(c.extras||[]).map((e,x)=>`<div><label class="fl" for="x${j}_${x}">${esc(e.label)}</label><input id="x${j}_${x}" autocomplete="off"></div>`).join("")}</div>`:""}</article>`}).join("");
 $("env").onclick=enviar;
 if($("igual"))$("igual").onclick=()=>{["s10","s500","arla"].forEach(k=>{const v=$("u0"+k)?.value;if(v===undefined)return;T.postos.forEach((_,j)=>{const i=$("u"+j+k);if(i)i.value=v})})}}
async function enviar(){
 const itens=[],E=$("er");
 for(let j=0;j<T.postos.length;j++){const p=T.postos[j],c=p.config||{};let any=false;const ex={};
  if(c.observacao&&$("o"+j).value.trim())ex.observacao=$("o"+j).value.trim();
  (c.extras||[]).forEach((e,x)=>{const v=$(`x${j}_${x}`).value.trim();if(v)ex[e.id]=v});
  for(const k of p.produtos||[]){const raw=$("u"+j+k).value.trim();if(!raw)continue;const v=num(raw);
   if(v==null||v<1||v>12){E.textContent=`Confira o preço de ${NM[k]} em ${p.nome} (${p.cidade}): use reais por litro, por exemplo 6,89.`;return}
   itens.push({posto_id:p.id,produto:k,valor:v,extras:ex});any=true}
  if(!any){E.textContent=`Faltam preços em ${p.nome} (${p.cidade}). Informe pelo menos um combustível.`;return}}
 E.textContent="";$("env").disabled=true;
 const {data,error}=await sb.rpc("enviar_precos",{p_token:tk,p_itens:itens});
 if(error){$("env").disabled=false;E.textContent="Não foi possível enviar agora. Tente novamente em instantes.";return}
 $("box").innerHTML=`<div class="sucesso"><div class="v">✓</div><h2 style="margin:0 0 7px">Preços enviados</h2><p style="margin:0 0 16px">${T.postos.length>1?T.postos.length+" unidades registradas":"Unidade registrada"} às ${new Date().toTimeString().slice(0,5)}. Obrigado pela atualização!</p><button class="btn" id="corr">Corrigir valores</button></div>`;
 $("corr").onclick=iniciar}
iniciar();
</script>
</body>
</html>

main{max-width:850px;margin:0 auto;padding:24px 16px 110px}.card{background:transparent}.welcome{background:linear-gradient(135deg,var(--purple),#49345a);border-radius:22px;padding:23px;color:#fff;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,205,80,.1);right:-55px;top:-75px}.welcome .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--yellow);font-weight:800}.welcome h2{font-size:25px;line-height:1.12;margin:5px 0 8px}.welcome p{margin:0;color:rgba(255,255,255,.77);max-width:630px;font-size:13px}

.action-zone{position:sticky;bottom:10px;z-index:15;margin-top:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:17px;padding:10px;box-shadow:0 14px 40px rgba(39,27,45,.13);display:flex;gap:8px;align-items:center}.btn{border:0;background:var(--purple);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:var(--purple-2)}.btn:disabled{opacity:.6;cursor:wait}.btn.primary{flex:1;font-size:15px}.btn.secondary{background:var(--surface);color:var(--purple);border:1px solid var(--border);font-size:12px}.btn.secondary:hover{background:var(--purple-soft)}

.lock-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.lock-date{background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px}.lock-date span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#8a818e;font-weight:800}.lock-date b{display:block;margin-top:2px;font-size:11px;color:#4e4553}
.manual-note{display:flex;gap:8px;align-items:center;background:var(--green-bg);border:1px solid #cfeadb;color:var(--green);border-radius:11px;padding:9px 10px;font-size:11px;font-weight:750;margin-bottom:12px}.manual-note .dot{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;flex:0 0 auto}

.footer{text-align:center;color:#6f6873;font-size:13px;font-weight:650;padding:24px 0 4px}
@media(max-width:650px){.request-box{align-items:stretch;flex-direction:column}.whatsapp-request{width:100%}.lock-dates{grid-template-columns:1fr}.site-head{padding:9px 13px}.site-head img{width:92px;height:39px}.site-head-copy .head-subtitle{display:none}.site-head-copy strong{font-size:13px}.site-head-copy .head-credit{font-size:8.5px}main{padding:15px 11px 104px}.welcome{padding:18px;border-radius:18px}.welcome h2{font-size:22px}.station-card{padding:14px;border-radius:17px}.price-grid{grid-template-columns:1fr}.price-field{display:grid;grid-template-columns:1fr minmax(130px,170px);column-gap:10px;align-items:center}.price-field label{margin:0}.price-input{grid-column:2;grid-row:1 / span 2}.last-price{grid-column:1;grid-row:2;margin:2px 0 0}.action-zone{bottom:max(8px,env(safe-area-inset-bottom));flex-direction:column}.btn{width:100%}}


/* AGT-LOG · Botões vivos — apenas apresentação visual.
   Preserva paleta, dimensões, ações, permissões e dados do sistema. */
:where(button, a.whatsapp-request){
  --agt-vivo-x:50%;
  --agt-vivo-y:50%;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:transform .24s cubic-bezier(.2,.8,.2,1),
             box-shadow .24s ease, filter .24s ease,
             background-color .24s ease, border-color .24s ease;
}
:where(button, a.whatsapp-request)::before,
:where(button, a.whatsapp-request)::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:1;
}
:where(button, a.whatsapp-request)::before{
  opacity:0;
  background:radial-gradient(190px circle at var(--agt-vivo-x) var(--agt-vivo-y),
    rgba(255,255,255,.25),rgba(255,255,255,.06) 38%,transparent 75%);
  transition:opacity .20s ease;
}
/* Nas superfícies claras, o reflexo utiliza o roxo da AGT-LOG. */
:where(button.btn.secondary, button.btn.unlock, button.chip, button.refresh-top, aside button):not([aria-current="true"])::before{
  background:radial-gradient(190px circle at var(--agt-vivo-x) var(--agt-vivo-y),
    rgba(102,64,130,.12),rgba(102,64,130,.03) 43%,transparent 76%);
}
:where(button, a.whatsapp-request)::after{
  background:linear-gradient(108deg,transparent 24%,rgba(255,255,255,.20) 49%,transparent 74%);
  transform:translateX(-145%) skewX(-16deg);
  opacity:0;
  transition:transform .70s cubic-bezier(.2,.8,.2,1),opacity .16s ease;
}
@media(hover:hover) and (pointer:fine){
  :where(button:not(:disabled), a.whatsapp-request):hover{
    transform:translateY(-2px);
    filter:brightness(1.045);
    box-shadow:0 10px 24px rgba(53,35,68,.19);
  }
  :where(aside button, tr.g button, button.chip):not(:disabled):hover{
    transform:translateY(-1px);
    box-shadow:0 5px 14px rgba(53,35,68,.09);
  }
  :where(button:not(:disabled), a.whatsapp-request):hover::before{opacity:1}
  :where(button:not(:disabled), a.whatsapp-request):hover::after{
    opacity:1;
    transform:translateX(145%) skewX(-16deg);
  }
}
:where(button:not(:disabled), a.whatsapp-request):active{
  transform:translateY(0) scale(.982);
  filter:brightness(.98);
  transition-duration:.10s;
}
:where(button:disabled,button[aria-disabled="true"]){
  cursor:not-allowed;
}
:where(button:disabled,button[aria-disabled="true"])::before,
:where(button:disabled,button[aria-disabled="true"])::after{opacity:0!important}
.agt-vivo-ripple{
  position:absolute;
  left:0;top:0;
  width:18px;height:18px;
  border-radius:50%;
  background:rgba(255,255,255,.34);
  pointer-events:none;
  z-index:2;
  transform:translate(-50%,-50%) scale(0);
  animation:agt-vivo-pulse .55s ease-out forwards;
}
:where(button.btn.secondary,button.btn.unlock,button.chip,button.refresh-top,aside button) .agt-vivo-ripple{
  background:rgba(100,62,129,.18);
}
@keyframes agt-vivo-pulse{
  0%{opacity:.72;transform:translate(-50%,-50%) scale(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(var(--agt-vivo-scale,15))}
}
@media(prefers-reduced-motion:reduce){
  :where(button,a.whatsapp-request),
  :where(button,a.whatsapp-request)::before,
  :where(button,a.whatsapp-request)::after{
    animation:none!important;
    transition:none!important;
  }
  :where(button,a.whatsapp-request):hover,
  :where(button,a.whatsapp-request):active{transform:none!important;filter:none!important}
  .agt-vivo-ripple{display:none!important;animation:none!important}
}

</style>

<body>
<header class="site-head"><div class="site-head-inner"><img src="logo.png" alt="AGT-LOG Logística e Cargas"><div class="site-head-copy"><strong>Atualização de preços</strong><span class="head-credit">Desenvolvido por Luiz Tyrone · Celular: (62) 98531-8950</span><span class="head-subtitle">Canal exclusivo para responsáveis de postos</span></div></div></header>
<main>
 <div class="card" id="box"><div class="loading"><div class="loading-dot"></div><p>Carregando suas unidades…</p></div></div>
 <div class="footer">Desenvolvido por Luiz Tyrone · Celular: 62985318950</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>

const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),f=v=>v==null?"":Number(v).toFixed(2).replace(".",",");
const sb=supabase.createClient(CFG.url,CFG.key),NM={s10:"Diesel S-10",s500:"Diesel S-500",arla:"Arla"},tk=new URLSearchParams(location.search).get("t");
let T=null;
const num=s=>{const n=parseFloat(String(s).replace(",","."));return isNaN(n)?null:n};
const money=v=>v==null?"sem valor anterior":"R$ "+f(v);
const dateTime=iso=>{if(!iso)return "—";const d=new Date(iso);return d.toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
function formatarPrecoAutomatico(el){
 const digitos=String(el.value||"").replace(/\D/g,"");
 if(!digitos){el.value="";return}
 const base=digitos.padStart(3,"0");
 const centavos=base.slice(-2);
 const reais=(base.slice(0,-2).replace(/^0+(?=\d)/,"")||"0");
 el.value=`${reais},${centavos}`;
 try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}
}
function ativarMascarasPreco(){
 document.querySelectorAll(".price-field input").forEach(el=>{
  el.addEventListener("input",()=>formatarPrecoAutomatico(el));
  el.addEventListener("focus",()=>{try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}});
 });
}
async function iniciar(){
 if(!tk)return invalido();
 const {data,error}=await sb.rpc("carregar_tela",{p_token:tk});
 if(error||!data)return invalido();
 T=data;
 desenhar();
}
function invalido(){$("box").innerHTML=`<div class="invalid"><div class="invalid-icon">!</div><h2>Link inválido</h2><p>Este link não está ativo. Peça um novo link à equipe da AGT-LOG.</p></div>`}
function cardEditavel(p,j){
 const c=p.config||{};
 return `${p.liberado_manual?`<div class="manual-note"><span class="dot">✓</span><span>Edição liberada pela administração para correção deste envio.</span></div>`:""}<div class="price-grid">${(p.produtos||[]).map(k=>`<div class="price-field"><label for="u${j}${k}">${NM[k]}</label><div class="price-input"><span>R$</span><input id="u${j}${k}" inputmode="numeric" pattern="[0-9]*" placeholder="0,00" autocomplete="off"></div><div class="last-price">Último informado: <b>${money(p.ultimos?.[k])}</b></div></div>`).join("")}</div>${c.observacao||(c.extras||[]).length?`<div class="extra-fields">${c.observacao?`<div><label class="fl" for="o${j}">Observação (opcional)</label><textarea id="o${j}" rows="2" placeholder="Digite uma observação, se necessário"></textarea></div>`:""}${(c.extras||[]).map((e,x)=>`<div><label class="fl" for="x${j}_${x}">${esc(e.label)}</label><input id="x${j}_${x}" autocomplete="off"></div>`).join("")}</div>`:""}`;
}
function cardBloqueado(p,j){
 const precos=(p.produtos||[]).filter(k=>p.ultimos?.[k]!=null).map(k=>`<div class="current-price">${NM[k]}<b>${money(p.ultimos[k])}</b></div>`).join("");
 return `<div class="lock-panel"><div class="lock-icon">🔒</div><div class="lock-title">Preços vigentes · alteração bloqueada</div><div class="lock-copy">Os preços desta unidade permanecem válidos até que uma nova alteração seja autorizada pela AGT-LOG.</div>${precos?`<div class="current-prices">${precos}</div>`:""}<div class="lock-dates"><div class="lock-date"><span>Última atualização</span><b>${dateTime(p.ultima_atualizacao)}</b></div><div class="lock-date"><span>Status</span><b>Aguardando nova liberação da AGT-LOG</b></div></div></div>`;
}
function linkSolicitarAlteracao(){
 const nomes=(T?.postos||[]).map(p=>`${p.nome}${p.cidade?` - ${p.cidade}${p.uf?`/${p.uf}`:""}`:""}`);
 const lista=nomes.length?"%0A%0A"+nomes.map(n=>"• "+n).join("%0A"):"";
 const texto=`Olá, sou ${encodeURIComponent(T?.responsavel||"")}. Houve alteração nos preços dos combustíveis e solicito a liberação para atualizar os preços de todos os postos vinculados ao meu link.${lista}`;
 return `https://wa.me/5562983239644?text=${texto}`;
}
function desenhar(){
 const editaveis=T.postos.filter(p=>p.pode_editar).length,bloqueados=T.postos.length-editaveis;

function copiarPrimeiraDisponivel(){
 const indices=T.postos.map((p,j)=>p.pode_editar?j:null).filter(j=>j!==null);
 if(indices.length<2)return;
 const base=indices[0];
 ["s10","s500","arla"].forEach(k=>{const v=$("u"+base+k)?.value;if(v===undefined)return;indices.forEach(j=>{const i=$("u"+j+k);if(i)i.value=v})});
}
async function enviar(){
 const itens=[],E=$("er");
 const editaveis=T.postos.map((p,j)=>({p,j})).filter(x=>x.p.pode_editar);
 if(!editaveis.length){E.textContent="Nenhuma unidade está liberada para alteração neste momento.";return}
 for(const {p,j} of editaveis){const c=p.config||{};let any=false;const ex={};
  if(c.observacao&&$("o"+j)?.value.trim())ex.observacao=$("o"+j).value.trim();
  (c.extras||[]).forEach((e,x)=>{const el=$(`x${j}_${x}`),v=el?el.value.trim():"";if(v)ex[e.id]=v});
  for(const k of p.produtos||[]){const el=$("u"+j+k),raw=el?el.value.trim():"";if(!raw)continue;const v=num(raw);

   itens.push({posto_id:p.id,produto:k,valor:v,extras:ex});any=true}

 E.textContent="";$("env").disabled=true;$("env").textContent="Enviando…";

 $("corr").onclick=iniciar;
}

<script>
/* AGT-LOG · Reflexo que acompanha o mouse e feedback de clique.
   Eventos delegados: botões carregados dinamicamente também recebem o efeito. */
(()=>{
  "use strict";
  const seletor='button, a.whatsapp-request';
  const reduzir=window.matchMedia('(prefers-reduced-motion: reduce)');
  const obter=el=>el instanceof Element?el.closest(seletor):null;
  const inativo=el=>el?.matches('button:disabled, [aria-disabled="true"]');
  document.addEventListener('pointermove',e=>{
    if(reduzir.matches || e.pointerType!=='mouse')return;
    const botao=obter(e.target);
    if(!botao || inativo(botao))return;
    const r=botao.getBoundingClientRect();
    botao.style.setProperty('--agt-vivo-x',(e.clientX-r.left)+'px');
    botao.style.setProperty('--agt-vivo-y',(e.clientY-r.top)+'px');
  },{passive:true});
  document.addEventListener('pointerdown',e=>{
    if(reduzir.matches || (e.pointerType==='mouse' && e.button!==0))return;
    const botao=obter(e.target);
    if(!botao || inativo(botao))return;
    const r=botao.getBoundingClientRect();
    const onda=document.createElement('span');
    onda.className='agt-vivo-ripple';
    onda.setAttribute('aria-hidden','true');
    onda.style.left=(e.clientX-r.left)+'px';
    onda.style.top=(e.clientY-r.top)+'px';
    onda.style.setProperty('--agt-vivo-scale',Math.ceil(Math.max(r.width,r.height)/9+2));
    botao.appendChild(onda);
    setTimeout(()=>onda.remove(),650);
  },{passive:true});
})();
</script>
